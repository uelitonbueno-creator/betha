<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Autenticando • BI Tributos</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#eff0f2;margin:0;min-height:100vh;display:grid;place-items:center;color:#24272c;padding:20px}
    .box{background:#fff;border:1px solid #dfe3e8;padding:30px;max-width:560px;width:100%;box-shadow:0 8px 28px rgba(0,0,0,.08);text-align:center}
    .brand{width:58px;height:58px;margin:0 auto 14px;border-radius:10px;background:#202b84;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;font-style:italic}
    h1{font-size:21px;font-weight:500;margin:0 0 8px}
    p{font-size:13px;color:#636b74;line-height:1.55;margin:0 0 12px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f6f7f8;border:1px solid #e3e6ea;padding:10px;word-break:break-word;margin:14px 0;display:none}
    .error{color:#a62d2d}
    button{width:100%;height:38px;border:0;background:#4263eb;color:#fff;font-weight:600;cursor:pointer;margin-top:10px;display:none}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">B</div>
    <h1 id="title">Concluindo acesso</h1>
    <p id="status">Recebemos o retorno da Betha. Validando a sessão do BI…</p>
    <div id="code" class="code"></div>
    <button id="retry" type="button">TENTAR NOVAMENTE</button>
  </main>

  <script src="../config.js?v=20261002-callback1"></script>
  <script src="auth.js?v=20261002-callback1"></script>
  <script>
    (async () => {
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const code = document.getElementById("code");
      const retry = document.getElementById("retry");

      function fail(errorCode) {
        title.textContent = "Não foi possível concluir o login";
        status.className = "error";
        status.textContent = "A autenticação na Betha ocorreu, mas o BI não conseguiu concluir a sessão.";
        code.style.display = "block";
        code.textContent = errorCode || "AUTH_CALLBACK_UNKNOWN";
        retry.style.display = "block";
      }

      retry.addEventListener("click", () => {
        try {
          BIAuth.clear();
          BIAuth.login();
        } catch (error) {
          fail(error.message || "LOGIN_RETRY_FAILED");
        }
      });

      try {
        if (!window.BIAuth) {
          fail("BIAUTH_NOT_LOADED");
          return;
        }

        await BIAuth.ready;

        if (!BIAuth.isAuthenticated()) {
          fail(BIAuth.getError() || "AUTH_SESSION_NOT_CREATED");
          return;
        }

        title.textContent = "Login concluído";
        status.textContent = "Sessão criada com sucesso. Abrindo o BI Tributos…";

        // Mantém tudo na mesma aba.
        location.replace("../");
      } catch (error) {
        fail(error && error.message ? error.message : "AUTH_CALLBACK_INTERNAL_ERROR");
      }
    })();
  </script>
</body>
</html>
