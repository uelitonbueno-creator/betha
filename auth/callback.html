<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autenticando • BI Tributos</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eff0f2;margin:0;min-height:100vh;display:grid;place-items:center;color:#24272c}
    .box{background:#fff;border:1px solid #dfe3e8;padding:28px;max-width:520px;width:calc(100% - 40px);box-sizing:border-box}
    h1{font-size:20px;font-weight:500;margin:0 0 8px}p{font-size:13px;color:#636b74;line-height:1.5}
    .error{color:#a62d2d;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box">
    <h1>Autenticando na Betha</h1>
    <p id="status">Validando o acesso do usuário…</p>
  </div>
  <script src="../config.js"></script>
  <script src="auth.js"></script>
  <script>
    BIAuth.handleCallback().catch((error) => {
      const el = document.getElementById("status");
      el.className = "error";
      el.textContent = "Não foi possível concluir a autenticação.\n\n" + error.message;
    });
  </script>
</body>
</html>
