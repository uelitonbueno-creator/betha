name: BI Vella - Panel Builder Checks
on:
  push:
    branches: [main]
    paths:
      - 'backend/worker.js'
      - 'backend/entry-persistent.js'
      - 'backend/multisystem-recovery.mjs'
      - 'backend/payroll-projection.mjs'
      - 'backend/procurement-situation.mjs'
      - 'tests/procurement-situation.test.cjs'
      - 'tests/payroll-projection.test.cjs'
      - 'tests/multisystem-recovery.test.cjs'
      - 'tests/multisystem-status-ui.test.cjs'
      - 'tests/mcp-real-dashboard.test.cjs'
      - 'tests/real-panels-ui.test.cjs'
      - 'tests/real-procurement-chart.test.cjs'
      - 'tests/real-dashboard-error-state.test.cjs'
      - 'tests/persistent-sync-storage.test.cjs'
      - 'tests/transient-sync-errors.test.cjs'
      - 'app.js'
      - 'index.html'
      - 'tests/boot-readiness.test.cjs'
      - 'auth/auth.js'
      - 'tests/auth-handoff-timeout.test.cjs'
      - 'tests/live-entrypoint-smoke.test.cjs'
      - 'tests/browser-boot-smoke.test.cjs'
      - 'tests/authenticated-browser-smoke.test.cjs'
      - 'panel-builder*.js'
      - 'panel-placements.js'
      - 'tests/panel-builder-*.test.cjs'
      - 'tests/panel-placements-queue.test.cjs'
      - 'tests/panel-placements-cancellation.test.cjs'
      - 'tests/panel-builder-migrations.test.py'
      - 'backend/migrations/20261009_panel_*.sql'
      - '.github/workflows/panel-builder-checks.yml'
  pull_request:
    paths:
      - 'backend/worker.js'
      - 'backend/entry-persistent.js'
      - 'backend/multisystem-recovery.mjs'
      - 'backend/payroll-projection.mjs'
      - 'backend/procurement-situation.mjs'
      - 'tests/procurement-situation.test.cjs'
      - 'tests/payroll-projection.test.cjs'
      - 'tests/multisystem-recovery.test.cjs'
      - 'tests/multisystem-status-ui.test.cjs'
      - 'tests/mcp-real-dashboard.test.cjs'
      - 'tests/real-panels-ui.test.cjs'
      - 'tests/real-procurement-chart.test.cjs'
      - 'tests/real-dashboard-error-state.test.cjs'
      - 'tests/persistent-sync-storage.test.cjs'
      - 'tests/transient-sync-errors.test.cjs'
      - 'app.js'
      - 'index.html'
      - 'tests/boot-readiness.test.cjs'
      - 'auth/auth.js'
      - 'tests/auth-handoff-timeout.test.cjs'
      - 'tests/live-entrypoint-smoke.test.cjs'
      - 'tests/browser-boot-smoke.test.cjs'
      - 'tests/authenticated-browser-smoke.test.cjs'
      - 'panel-builder*.js'
      - 'panel-placements.js'
      - 'tests/panel-builder-*.test.cjs'
      - 'tests/panel-placements-queue.test.cjs'
      - 'tests/panel-placements-cancellation.test.cjs'
      - 'tests/panel-builder-migrations.test.py'
      - 'backend/migrations/20261009_panel_*.sql'
      - '.github/workflows/panel-builder-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-panel-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check backend/worker.js
          node --check backend/entry-persistent.js
          node --check backend/multisystem-recovery.mjs
          node --check backend/payroll-projection.mjs
          node --check backend/procurement-situation.mjs
          node --check app.js
          node --check auth/auth.js
          node --check panel-builder-core.js
          node --check panel-builder-ui.js
          node --check panel-builder-samples.js
          node --check panel-placements.js
      - name: Run panel builder tests
        run: |
          node --test tests/multisystem-recovery.test.cjs
          node --test tests/multisystem-status-ui.test.cjs
          node --test tests/mcp-real-dashboard.test.cjs
          node --test tests/real-panels-ui.test.cjs
          node --test tests/boot-readiness.test.cjs
          node --test tests/auth-handoff-timeout.test.cjs
          node --test tests/real-procurement-chart.test.cjs
          node --test tests/procurement-situation.test.cjs
          node --test tests/real-dashboard-error-state.test.cjs
          node --test tests/persistent-sync-storage.test.cjs
          node --test tests/transient-sync-errors.test.cjs
          node --test tests/payroll-projection.test.cjs
          node tests/panel-builder-core.test.cjs
          node tests/panel-builder-kpi.test.cjs
          node tests/panel-placements-cancellation.test.cjs
          node tests/panel-builder-filters.test.cjs
          node tests/panel-builder-security.test.cjs
          node tests/panel-builder-editor-context.test.cjs
          node tests/panel-placements-queue.test.cjs
          node tests/panel-builder-d1.test.cjs
          node tests/panel-builder-schema.test.cjs
      - name: Validate D1 migration chain
        run: python3 tests/panel-builder-migrations.test.py
      - name: Smoke-test public Pages and Worker (read-only)
        run: node --test tests/live-entrypoint-smoke.test.cjs
      - name: Render candidate login in headless Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bi-vella-http.log 2>&1 &
          sleep 1
          node --test tests/browser-boot-smoke.test.cjs
          node --test tests/authenticated-browser-smoke.test.cjs
