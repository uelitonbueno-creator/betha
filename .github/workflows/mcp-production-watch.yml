name: MCP production watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mcp-sdk-v2-main
    paths:
      - "backend/worker.js"
      - "config/page-mapping.json"
      - "config/mcp-tools.generated.json"
      - "scripts/generate-mcp-tools.mjs"
      - "scripts/check-mcp-contract.mjs"
      - "scripts/check-mcp-oauth.mjs"
      - "mcp/**"
      - ".github/workflows/mcp-production-watch.yml"
  pull_request:
    paths:
      - "backend/worker.js"
      - "config/page-mapping.json"
      - "config/mcp-tools.generated.json"
      - "scripts/generate-mcp-tools.mjs"
      - "scripts/check-mcp-contract.mjs"
      - "scripts/check-mcp-oauth.mjs"
      - "mcp/**"
      - ".github/workflows/mcp-production-watch.yml"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-production-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate MCP catalog
        run: node scripts/generate-mcp-tools.mjs

      - name: Verify catalog is synchronized
        run: git diff --exit-code -- config/mcp-tools.generated.json

      - name: Validate MCP safety contract
        run: node scripts/check-mcp-contract.mjs

      - name: Validate MCP OAuth 2.1 contract
        run: node scripts/check-mcp-oauth.mjs

      - name: Install MCP Worker dependencies
        run: npm install --prefix mcp --ignore-scripts --no-audit --no-fund

      - name: Build MCP Worker SDK v2 (dry-run)
        run: npm --prefix mcp run check

      - name: Check BI production health
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://betha-bi-api.ueliton-bueno.workers.dev/api/health \
            -o /tmp/bi-health.json
          cat /tmp/bi-health.json
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/bi-health.json","utf8"));if(!j.ok) process.exit(1);'

      - name: Check legacy MCP route remains fail-closed for GET
        run: |
          code="$(curl --silent --show-error --max-time 20 -o /tmp/mcp-get.json -w '%{http_code}' \
            https://betha-bi-api.ueliton-bueno.workers.dev/mcp)"
          cat /tmp/mcp-get.json
          test "$code" = "405"
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/mcp-get.json","utf8"));if(j.error!=="MCP_POST_REQUIRED") process.exit(1);'

  report:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Update production queue status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          marker='<!-- MCP_HOURLY_WATCH -->'
          now="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if [ "${RESULT}" = "success" ]; then
            state="OK"
            detail="SDK v2, catálogo, contrato e health do BI validados a partir da main."
          else
            state="FALHA_VALIDACAO"
            detail="A validação canônica do MCP na main falhou; revisar o workflow antes de promover mudanças."
          fi

          body="${marker}
          **MCP production watch:** ${state}
          - Última verificação: ${now}
          - Branch canônica: `main`
          - ${detail}"

          comment_id="$(gh api "repos/${REPO}/issues/1/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"

          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="${body}" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/1/comments" -f body="${body}" >/dev/null
          fi
