name: MCP hourly guard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "backend/worker.js"
      - "config/page-mapping.json"
      - "scripts/generate-mcp-tools.mjs"

permissions:
  contents: read

jobs:
  catalog-and-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate MCP catalog
        run: node scripts/generate-mcp-tools.mjs
      - name: Verify generated catalog is committed
        run: git diff --exit-code -- config/mcp-tools.generated.json
      - name: Check BI health
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 \
            https://betha-bi-api.ueliton-bueno.workers.dev/api/health \
            | tee /tmp/bi-health.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/bi-health.json","utf8")); if(!j.ok) process.exit(1);'
